version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: devcontainers
    directories:
      - /
      - /src/*
    schedule:
      interval: weekly
    labels: [dependencies]
