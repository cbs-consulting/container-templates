# Publishes Dev Container Templates to the GitHub Container Registry (GHCR) on every push
# to main. Pull requests and the merge queue run the job without logging in or publishing,
# so nothing reaches GHCR before it is merged.

name: Publish Dev Container Templates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The merge queue tests each pull request on top of main and the pull requests queued
  # ahead of it, and waits for the required checks on that commit.
  merge_group:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish templates
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          devcontainer templates publish \
            --registry ghcr.io \
            --namespace cbs-consulting/container-templates \
            ./src
